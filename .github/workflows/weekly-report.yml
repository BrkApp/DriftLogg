name: Weekly Risk Report

on:
  schedule:
    # Tous les lundis à 8h UTC
    - cron: '0 8 * * 1'
  # Lancement manuel depuis l'onglet Actions de GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly report
        env:
          GITHUB_TOKEN: ${{ secrets.REPORT_GITHUB_TOKEN }}
        run: |
          npx esbuild scripts/generate-weekly-report.ts --bundle --platform=node --format=cjs --outfile=.report-bundle.cjs
          node .report-bundle.cjs
          rm -f .report-bundle.cjs

      - name: Check if report was generated
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push report
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "DriftLogg Bot"
          git config user.email "bot@driftlogg.com"
          git add content/reports/
          git commit -m "📊 Weekly risk report — $(date +%Y-%m-%d)"
          git push
